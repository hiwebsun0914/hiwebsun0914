<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sun's Dev Lab interactive mission control</title>
  <desc id="desc">Animated developer profile banner with a terminal, mission cards, moving signals and system status</desc>
  <defs>
    <linearGradient id="bg" x1="45" y1="15" x2="1150" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050B16"/>
      <stop offset="0.52" stop-color="#071426"/>
      <stop offset="1" stop-color="#0B1630"/>
    </linearGradient>
    <linearGradient id="edge" x1="80" y1="40" x2="1120" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity=".11"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#72D7FF" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1095" cy="40" r="240" fill="#7C3AED" fill-opacity=".07"/>
    <circle cx="90" cy="415" r="230" fill="#0891B2" fill-opacity=".07"/>

    <rect x="0" y="-80" width="1200" height="130" fill="url(#scan)">
      <animate attributeName="y" values="-100;420;-100" dur="8s" repeatCount="indefinite"/>
    </rect>

    <g opacity=".22">
      <path d="M758 105C852 105 854 80 948 80S1044 105 1121 105" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5 8"/>
      <path d="M758 205C850 205 863 236 950 236S1042 205 1121 205" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 8"/>
      <path d="M758 305C847 305 875 336 958 336S1046 305 1121 305" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="5 8"/>
    </g>

    <g filter="url(#glow)">
      <circle r="4" fill="#67E8F9">
        <animateMotion dur="3.8s" repeatCount="indefinite" path="M758 105C852 105 854 80 948 80S1044 105 1121 105"/>
      </circle>
      <circle r="4" fill="#C4B5FD">
        <animateMotion dur="4.6s" repeatCount="indefinite" path="M758 205C850 205 863 236 950 236S1042 205 1121 205"/>
      </circle>
      <circle r="4" fill="#86EFAC">
        <animateMotion dur="4.1s" repeatCount="indefinite" path="M758 305C847 305 875 336 958 336S1046 305 1121 305"/>
      </circle>
    </g>

    <rect x="32" y="27" width="1136" height="366" rx="20" stroke="url(#edge)" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M32 73H1168" stroke="#86D8F8" stroke-opacity=".13"/>

    <g font-family="Consolas, Menlo, monospace">
      <circle cx="58" cy="50" r="6" fill="#FB7185"/>
      <circle cx="79" cy="50" r="6" fill="#FBBF24"/>
      <circle cx="100" cy="50" r="6" fill="#4ADE80"/>
      <text x="127" y="56" fill="#6F8BA8" font-size="13">sun-dev-lab://mission-control</text>
      <circle cx="1104" cy="50" r="5" fill="#22C55E">
        <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1117" y="55" fill="#86EFAC" font-size="11" font-weight="700">ONLINE</text>

      <text x="73" y="112" fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="2.5">PLAYER ONE // SUN BINHAN</text>
      <text x="71" y="172" fill="#F8FAFC" font-size="54" font-weight="800" letter-spacing="-2">SUN'S DEV LAB</text>
      <text x="73" y="207" fill="#A7BCD2" font-size="17">Build systems. Teach machines. Ship ideas.</text>

      <rect x="72" y="239" width="590" height="99" rx="12" fill="#020817" fill-opacity=".72" stroke="#38BDF8" stroke-opacity=".16"/>
      <text x="92" y="267" fill="#4ADE80" font-size="14">$ ./choose-mission</text>
      <text x="92" y="294" fill="#8DA7C0" font-size="14">[01] CAMPUS MAP   [02] MOTION GAME</text>
      <text x="92" y="319" fill="#8DA7C0" font-size="14">[03] PRINT CLOUD  [04] MEDICAL AI</text>
      <rect x="504" y="305" width="9" height="17" rx="1" fill="#67E8F9">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <text x="73" y="369" fill="#56738F" font-size="12">SYSU · SHENZHEN · FULL-STACK / CV / AI</text>
    </g>

    <g font-family="Consolas, Menlo, monospace">
      <text x="728" y="102" fill="#56738F" font-size="11" letter-spacing="1.8">AVAILABLE MISSIONS</text>

      <g>
        <rect x="728" y="121" width="395" height="63" rx="11" fill="#0B2133" stroke="#22D3EE" stroke-opacity=".38"/>
        <rect x="744" y="136" width="34" height="34" rx="8" fill="#22D3EE" fill-opacity=".13"/>
        <text x="753" y="159" fill="#67E8F9" font-size="15" font-weight="700">01</text>
        <text x="795" y="148" fill="#E7F7FE" font-size="13" font-weight="700">EXPLORE A CAMPUS</text>
        <text x="795" y="169" fill="#6F93AD" font-size="11">full-stack · multi-platform</text>
        <text x="1087" y="159" fill="#67E8F9" font-size="17">›</text>
      </g>

      <g>
        <rect x="728" y="196" width="395" height="63" rx="11" fill="#17172F" stroke="#A78BFA" stroke-opacity=".38"/>
        <rect x="744" y="211" width="34" height="34" rx="8" fill="#A78BFA" fill-opacity=".13"/>
        <text x="753" y="234" fill="#C4B5FD" font-size="15" font-weight="700">02</text>
        <text x="795" y="223" fill="#F1EEFF" font-size="13" font-weight="700">MOVE TO PLAY</text>
        <text x="795" y="244" fill="#8B83B0" font-size="11">vision · natural interaction</text>
        <text x="1087" y="234" fill="#C4B5FD" font-size="17">›</text>
      </g>

      <g>
        <rect x="728" y="271" width="395" height="63" rx="11" fill="#0D251D" stroke="#4ADE80" stroke-opacity=".38"/>
        <rect x="744" y="286" width="34" height="34" rx="8" fill="#4ADE80" fill-opacity=".13"/>
        <text x="753" y="309" fill="#86EFAC" font-size="15" font-weight="700">03</text>
        <text x="795" y="298" fill="#EBFFF2" font-size="13" font-weight="700">CONNECT THE MACHINES</text>
        <text x="795" y="319" fill="#6D9B7B" font-size="11">IoT · cloud · deployment</text>
        <text x="1087" y="309" fill="#86EFAC" font-size="17">›</text>
      </g>

      <text x="728" y="365" fill="#FB7185" font-size="12" font-weight="700">
        SELECT A QUEST BELOW
        <animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
