<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sun BinHan — Student Developer</title>
  <desc id="desc">Profile banner for a full-stack, computer vision and AI tool builder</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="1160" y2="360" gradientUnits="userSpaceOnUse">
